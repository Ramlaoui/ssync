<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10141D" />
    <meta name="description" content="An interactive proposal for the next ssync web interface." />
    <title>ssync — Design preview</title>
    <script>
      try {
        const theme = localStorage.getItem('ssync-design-theme') || 'dark';
        document.documentElement.dataset.theme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="design-app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
