[project]
site_name = "ssync"
site_description = "Run, watch, and relaunch Slurm jobs across all your HPC clusters from one place: CLI, web app, and iPhone."
site_url = "https://ssync.readthedocs.io/"
site_author = "Ali Ramlaoui"
repo_url = "https://github.com/Ramlaoui/ssync"
repo_name = "Ramlaoui/ssync"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Ali Ramlaoui · Apache 2.0"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/zoom.js"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/configuration.md",
  ] },
  { "Guides" = [
    "guides/web-app.md",
    "guides/ios-app.md",
    "guides/launching-jobs.md",
    "guides/outputs.md",
    { "Watchers" = "guides/watchers.md" },
    { "Resubmit from checkpoints" = "guides/watcher-resubmit.md" },
    { "Launch recipes" = "guides/recipes.md" },
    "guides/integrations.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/api.md",
    "reference/security.md",
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
language = "en"
logo = "assets/brand/mark.svg"
favicon = "assets/brand/mark.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Ramlaoui/ssync"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
